<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amici - Sfida</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #0a0a0a;
            --bg-card: #1a1a1a;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: #9ca3af;
            --accent-gold: #d4af37;
            --accent-red: #dc2626;
            --accent-blue: #3b82f6;
            --glow-gold: rgba(212, 175, 55, 0.3);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Subtle background gradient */
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 20% 30%, rgba(212, 175, 55, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(59, 130, 246, 0.03) 0%, transparent 50%),
                var(--bg-dark);
            z-index: 0;
        }

        /* Main container */
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            padding: 3rem 4rem 2rem;
            text-align: center;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: 0.2em;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 0.875rem;
            font-weight: 500;
            letter-spacing: 0.15em;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        /* Arena */
        .arena {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 2rem;
        }

        .stage {
            position: relative;
            width: 100%;
            max-width: 1200px;
            height: 600px;
        }

        /* Battle circle - orbit container */
        .battle-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 700px;
            height: 700px;
            transform: translate(-50%, -50%);
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Card containers that orbit */
        .card-orbit {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 340px;
            height: 480px;
            margin-left: -170px;
            margin-top: -240px;
            transform-origin: 170px 240px;
        }

        .card-orbit.left {
            transform: rotate(0deg) translateX(-350px) rotate(0deg);
        }

        .card-orbit.right {
            transform: rotate(0deg) translateX(350px) rotate(0deg);
        }

        /* Battle animation - cards orbit around center */
        .battle-circle.battling .card-orbit.left {
            animation: orbitLeft 4s ease-in-out;
        }

        .battle-circle.battling .card-orbit.right {
            animation: orbitRight 4s ease-in-out;
        }

        @keyframes orbitLeft {
            0% { transform: rotate(0deg) translateX(-350px) rotate(0deg); }
            25% { transform: rotate(90deg) translateX(-350px) rotate(-90deg); }
            50% { transform: rotate(180deg) translateX(-350px) rotate(-180deg); }
            75% { transform: rotate(270deg) translateX(-350px) rotate(-270deg); }
            100% { transform: rotate(360deg) translateX(-350px) rotate(-360deg); }
        }

        @keyframes orbitRight {
            0% { transform: rotate(0deg) translateX(350px) rotate(0deg); }
            25% { transform: rotate(90deg) translateX(350px) rotate(-90deg); }
            50% { transform: rotate(180deg) translateX(350px) rotate(-180deg); }
            75% { transform: rotate(270deg) translateX(350px) rotate(-270deg); }
            100% { transform: rotate(360deg) translateX(350px) rotate(-360deg); }
        }

        /* Winner animation */
        .card-orbit.winner {
            animation: moveToCenter 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards !important;
            z-index: 100;
        }

        .card-orbit.loser {
            animation: fadeAway 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards !important;
            z-index: 1;
        }

        @keyframes moveToCenter {
            to {
                transform: translate(-50%, -50%) scale(1.1);
                left: 50%;
                top: 50%;
                margin: 0;
            }
        }

        @keyframes fadeAway {
            to {
                opacity: 0;
                transform: scale(0.8);
            }
        }

        /* Card design */
        .card {
            width: 100%;
            height: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 2.5rem 2rem;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(20px);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--border-subtle), transparent);
        }

        /* Winner card glow */
        .card.winner-glow {
            border-color: var(--accent-gold);
            box-shadow:
                0 0 0 1px var(--accent-gold),
                0 0 60px var(--glow-gold),
                0 20px 40px rgba(0, 0, 0, 0.4);
        }

        /* Card header */
        .card-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .card-badge {
            display: inline-block;
            padding: 0.5rem 1.25rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
        }

        .badge-cantante {
            background: var(--accent-red);
            color: white;
        }

        .badge-ballerino {
            background: var(--accent-blue);
            color: white;
        }

        .card-name {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.75rem;
            letter-spacing: -0.02em;
        }

        .card-team {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        /* Avatar */
        .card-avatar {
            width: 160px;
            height: 160px;
            margin: 2rem auto;
            border-radius: 50%;
            background: linear-gradient(135deg, #2a2a2a, #1a1a1a);
            border: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            position: relative;
        }

        .card.winner-glow .card-avatar {
            border-color: var(--accent-gold);
            box-shadow: 0 0 30px var(--glow-gold);
        }

        .card.winner-glow .card-avatar::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            padding: 2px;
            background: linear-gradient(45deg, var(--accent-gold), transparent, var(--accent-gold));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: rotate 3s linear infinite;
        }

        @keyframes rotate {
            to { transform: rotate(360deg); }
        }

        /* VS divider */
        .vs-divider {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3rem;
            font-weight: 800;
            color: var(--text-primary);
            opacity: 0.4;
            letter-spacing: 0.1em;
            z-index: 50;
            pointer-events: none;
        }

        /* Countdown */
        .countdown {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 12rem;
            font-weight: 800;
            color: var(--accent-gold);
            opacity: 0;
            pointer-events: none;
            z-index: 200;
            text-shadow: 0 0 60px var(--glow-gold);
        }

        .countdown.show {
            animation: countdownPulse 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes countdownPulse {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.5);
            }
            50% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.1);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.9);
            }
        }

        /* Controls */
        .controls {
            padding: 2rem 4rem 3rem;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .btn {
            padding: 1rem 2.5rem;
            font-size: 0.875rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 0 0.5rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.5s, height 0.5s;
        }

        .btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn-primary {
            background: var(--accent-gold);
            color: var(--bg-dark);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px var(--glow-gold);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border-subtle);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.15);
        }

        /* Winner modal */
        .winner-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(20px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .winner-modal.show {
            display: flex;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .winner-content {
            text-align: center;
            position: relative;
        }

        .trophy {
            font-size: 8rem;
            margin-bottom: 2rem;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 0 40px var(--glow-gold));
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .winner-title {
            font-size: 1.5rem;
            font-weight: 300;
            letter-spacing: 0.2em;
            color: var(--text-secondary);
            text-transform: uppercase;
            margin-bottom: 1rem;
        }

        .winner-name {
            font-size: 4rem;
            font-weight: 800;
            color: var(--accent-gold);
            margin-bottom: 3rem;
            text-shadow: 0 0 60px var(--glow-gold);
        }

        /* Confetti */
        .confetti {
            position: fixed;
            width: 8px;
            height: 8px;
            z-index: 999;
        }

        @keyframes confettiFall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .battle-circle {
                width: 600px;
                height: 600px;
            }

            .card-orbit.left {
                transform: rotate(0deg) translateX(-300px) rotate(0deg);
            }

            .card-orbit.right {
                transform: rotate(0deg) translateX(300px) rotate(0deg);
            }

            @keyframes orbitLeft {
                0% { transform: rotate(0deg) translateX(-300px) rotate(0deg); }
                25% { transform: rotate(90deg) translateX(-300px) rotate(-90deg); }
                50% { transform: rotate(180deg) translateX(-300px) rotate(-180deg); }
                75% { transform: rotate(270deg) translateX(-300px) rotate(-270deg); }
                100% { transform: rotate(360deg) translateX(-300px) rotate(-360deg); }
            }

            @keyframes orbitRight {
                0% { transform: rotate(0deg) translateX(300px) rotate(0deg); }
                25% { transform: rotate(90deg) translateX(300px) rotate(-90deg); }
                50% { transform: rotate(180deg) translateX(300px) rotate(-180deg); }
                75% { transform: rotate(270deg) translateX(300px) rotate(-270deg); }
                100% { transform: rotate(360deg) translateX(300px) rotate(-360deg); }
            }

            .card-orbit {
                width: 300px;
                height: 420px;
                margin-left: -150px;
                margin-top: -210px;
            }

            .card-name {
                font-size: 1.75rem;
            }

            .countdown {
                font-size: 8rem;
            }
        }

        @media (max-width: 768px) {
            .header {
                padding: 2rem 2rem 1rem;
            }

            .logo {
                font-size: 2rem;
            }

            .battle-circle {
                width: 400px;
                height: 400px;
            }

            .card-orbit {
                width: 260px;
                height: 360px;
                margin-left: -130px;
                margin-top: -180px;
            }

            .card-orbit.left {
                transform: rotate(0deg) translateX(-200px) rotate(0deg);
            }

            .card-orbit.right {
                transform: rotate(0deg) translateX(200px) rotate(0deg);
            }

            @keyframes orbitLeft {
                0% { transform: rotate(0deg) translateX(-200px) rotate(0deg); }
                25% { transform: rotate(90deg) translateX(-200px) rotate(-90deg); }
                50% { transform: rotate(180deg) translateX(-200px) rotate(-180deg); }
                75% { transform: rotate(270deg) translateX(-200px) rotate(-270deg); }
                100% { transform: rotate(360deg) translateX(-200px) rotate(-360deg); }
            }

            @keyframes orbitRight {
                0% { transform: rotate(0deg) translateX(200px) rotate(0deg); }
                25% { transform: rotate(90deg) translateX(200px) rotate(-90deg); }
                50% { transform: rotate(180deg) translateX(200px) rotate(-180deg); }
                75% { transform: rotate(270deg) translateX(200px) rotate(-270deg); }
                100% { transform: rotate(360deg) translateX(200px) rotate(-360deg); }
            }

            .card {
                padding: 2rem 1.5rem;
            }

            .card-name {
                font-size: 1.5rem;
            }

            .card-avatar {
                width: 120px;
                height: 120px;
                font-size: 3rem;
            }

            .vs-divider {
                font-size: 2rem;
            }

            .countdown {
                font-size: 6rem;
            }

            .winner-name {
                font-size: 2.5rem;
            }

            .trophy {
                font-size: 5rem;
            }

            .controls {
                padding: 1.5rem 2rem 2rem;
            }

            .btn {
                padding: 0.875rem 2rem;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <!-- Background -->
    <div class="background"></div>

    <!-- Main container -->
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1 class="logo">Amici</h1>
            <p class="subtitle">La Sfida</p>
        </header>

        <!-- Arena -->
        <div class="arena">
            <div class="stage">
                <!-- Battle circle -->
                <div class="battle-circle" id="battleCircle">
                    <!-- VS divider -->
                    <div class="vs-divider">VS</div>

                    <!-- Card 1 -->
                    <div class="card-orbit left" id="cardOrbit1">
                        <div class="card" id="card1">
                            <div class="card-header">
                                <div class="card-badge badge-cantante">Cantante</div>
                                <h2 class="card-name">Luca Rossi</h2>
                                <p class="card-team">Squadra Zerbi-Celentano</p>
                            </div>
                            <div class="card-avatar">🎤</div>
                        </div>
                    </div>

                    <!-- Card 2 -->
                    <div class="card-orbit right" id="cardOrbit2">
                        <div class="card" id="card2">
                            <div class="card-header">
                                <div class="card-badge badge-ballerino">Ballerino</div>
                                <h2 class="card-name">Maria Bianchi</h2>
                                <p class="card-team">Squadra Cuccarini-Lo</p>
                            </div>
                            <div class="card-avatar">💃</div>
                        </div>
                    </div>
                </div>

                <!-- Countdown -->
                <div class="countdown" id="countdown"></div>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <button class="btn btn-primary" id="startBtn" onclick="startChallenge()">
                Inizia Sfida
            </button>
            <button class="btn btn-secondary" onclick="resetChallenge()">
                Reset
            </button>
        </div>
    </div>

    <!-- Winner modal -->
    <div class="winner-modal" id="winnerModal">
        <div class="winner-content">
            <div class="trophy">🏆</div>
            <p class="winner-title">Vincitore</p>
            <h2 class="winner-name" id="winnerName"></h2>
            <button class="btn btn-primary" onclick="closeModal()">Chiudi</button>
        </div>
    </div>

    <script>
        let isRunning = false;

        async function startChallenge() {
            if (isRunning) return;
            isRunning = true;

            const startBtn = document.getElementById('startBtn');
            startBtn.disabled = true;

            const battleCircle = document.getElementById('battleCircle');

            // Wait a moment
            await sleep(500);

            // Start battle animation (cards orbit)
            battleCircle.classList.add('battling');

            // Battle duration - 4 seconds for smooth orbit
            await sleep(4000);

            // Remove battle class
            battleCircle.classList.remove('battling');

            // Countdown
            await showCountdown(3);
            await showCountdown(2);
            await showCountdown(1);

            // Determine winner randomly
            const winnerNum = Math.random() > 0.5 ? 1 : 2;
            const loserNum = winnerNum === 1 ? 2 : 1;

            // Reveal winner
            await revealWinner(winnerNum, loserNum);
        }

        function showCountdown(num) {
            return new Promise(resolve => {
                const countdown = document.getElementById('countdown');
                countdown.textContent = num;
                countdown.classList.add('show');

                setTimeout(() => {
                    countdown.classList.remove('show');
                    setTimeout(resolve, 100);
                }, 700);
            });
        }

        async function revealWinner(winnerNum, loserNum) {
            const winnerOrbit = document.getElementById('cardOrbit' + winnerNum);
            const loserOrbit = document.getElementById('cardOrbit' + loserNum);
            const winnerCard = document.getElementById('card' + winnerNum);

            // Animate
            winnerOrbit.classList.add('winner');
            loserOrbit.classList.add('loser');
            winnerCard.classList.add('winner-glow');

            await sleep(1500);

            // Show modal
            const winnerName = winnerCard.querySelector('.card-name').textContent;
            document.getElementById('winnerName').textContent = winnerName;
            document.getElementById('winnerModal').classList.add('show');

            // Create confetti
            createConfetti();
        }

        function createConfetti() {
            const colors = ['#d4af37', '#dc2626', '#3b82f6', '#ffffff'];

            for (let i = 0; i < 80; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.top = '-10px';
                    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.animation = `confettiFall ${Math.random() * 2 + 2}s linear forwards`;
                    document.body.appendChild(confetti);

                    setTimeout(() => confetti.remove(), 4000);
                }, i * 30);
            }
        }

        function resetChallenge() {
            isRunning = false;

            document.getElementById('startBtn').disabled = false;
            document.getElementById('battleCircle').classList.remove('battling');

            document.querySelectorAll('.card-orbit').forEach(orbit => {
                orbit.classList.remove('winner', 'loser');
            });

            document.querySelectorAll('.card').forEach(card => {
                card.classList.remove('winner-glow');
            });

            document.getElementById('winnerModal').classList.remove('show');
            document.querySelectorAll('.confetti').forEach(c => c.remove());
        }

        function closeModal() {
            document.getElementById('winnerModal').classList.remove('show');
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // Close modal on background click
        document.getElementById('winnerModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });
    </script>
</body>
</html>
