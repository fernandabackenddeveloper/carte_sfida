<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amici - Sfida</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #0a0a0a;
            --bg-card: #1a1a1a;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: #9ca3af;
            --accent-gold: #d4af37;
            --accent-red: #dc2626;
            --accent-blue: #3b82f6;
            --glow-gold: rgba(212, 175, 55, 0.3);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 20% 30%, rgba(212, 175, 55, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(59, 130, 246, 0.03) 0%, transparent 50%),
                var(--bg-dark);
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 3rem 4rem 2rem;
            text-align: center;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: 0.2em;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 0.875rem;
            font-weight: 500;
            letter-spacing: 0.15em;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .arena {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 2rem;
        }

        .stage {
            position: relative;
            width: 100%;
            max-width: 1200px;
            height: 600px;
            perspective: 1500px;
        }

        .battle-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 900px;
            height: 600px;
            transform: translate(-50%, -50%);
            transform-style: preserve-3d;
        }

        /* Ellipse animation - cards move horizontally, one passes in front */
        .card-orbit {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 340px;
            height: 480px;
            margin-left: -170px;
            margin-top: -240px;
            transform-style: preserve-3d;
            transition: z-index 0.1s step-end;
        }

        .card-orbit.left {
            transform: translate3d(-400px, 0, 0);
            z-index: 10;
        }

        .card-orbit.right {
            transform: translate3d(400px, 0, 0);
            z-index: 10;
        }

        /* Ellipse battle animation */
        .battle-circle.battling .card-orbit.left {
            animation: ellipseLeft 5s ease-in-out;
        }

        .battle-circle.battling .card-orbit.right {
            animation: ellipseRight 5s ease-in-out;
        }

        @keyframes ellipseLeft {
            0% {
                transform: translate3d(-400px, 0, 0);
                z-index: 10;
            }
            25% {
                transform: translate3d(0, -80px, 250px);
                z-index: 50;
            }
            50% {
                transform: translate3d(400px, 0, 0);
                z-index: 10;
            }
            75% {
                transform: translate3d(0, 80px, -250px);
                z-index: 5;
            }
            100% {
                transform: translate3d(-400px, 0, 0);
                z-index: 10;
            }
        }

        @keyframes ellipseRight {
            0% {
                transform: translate3d(400px, 0, 0);
                z-index: 10;
            }
            25% {
                transform: translate3d(0, 80px, -250px);
                z-index: 5;
            }
            50% {
                transform: translate3d(-400px, 0, 0);
                z-index: 10;
            }
            75% {
                transform: translate3d(0, -80px, 250px);
                z-index: 50;
            }
            100% {
                transform: translate3d(400px, 0, 0);
                z-index: 10;
            }
        }

        /* Winner animation */
        .card-orbit.winner {
            animation: winnerReveal 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards !important;
            z-index: 100 !important;
        }

        .card-orbit.loser {
            animation: loserFadeOut 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards !important;
            z-index: 1 !important;
        }

        @keyframes winnerReveal {
            to {
                transform: translate(-50%, -50%) scale(1.15);
                left: 50%;
                top: 50%;
                margin: 0;
            }
        }

        @keyframes loserFadeOut {
            to {
                opacity: 0;
                transform: translate3d(0, 0, -500px) scale(0.7);
            }
        }

        .card {
            width: 100%;
            height: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 2rem;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(20px);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--border-subtle), transparent);
        }

        .card.winner-glow {
            border-color: var(--accent-gold);
            box-shadow:
                0 0 0 1px var(--accent-gold),
                0 0 60px var(--glow-gold),
                0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .card-header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .card-badge {
            display: inline-block;
            padding: 0.5rem 1.25rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 1rem;
        }

        .badge-cantante {
            background: var(--accent-red);
            color: white;
        }

        .badge-ballerino {
            background: var(--accent-blue);
            color: white;
        }

        .card-name {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }

        .card-team {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
        }

        /* Photo container */
        .card-photo {
            width: 200px;
            height: 200px;
            margin: 0 auto 1rem;
            border-radius: 12px;
            background: linear-gradient(135deg, #2a2a2a, #1a1a1a);
            border: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            position: relative;
            overflow: hidden;
        }

        .card-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card.winner-glow .card-photo {
            border-color: var(--accent-gold);
            box-shadow: 0 0 30px var(--glow-gold);
        }

        .card.winner-glow .card-photo::before {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 12px;
            padding: 2px;
            background: linear-gradient(45deg, var(--accent-gold), transparent, var(--accent-gold));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: rotate 3s linear infinite;
        }

        @keyframes rotate {
            to { transform: rotate(360deg); }
        }

        .vs-divider {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3rem;
            font-weight: 800;
            color: var(--text-primary);
            opacity: 0.4;
            letter-spacing: 0.1em;
            z-index: 50;
            pointer-events: none;
        }

        .countdown {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 12rem;
            font-weight: 800;
            color: var(--accent-gold);
            opacity: 0;
            pointer-events: none;
            z-index: 200;
            text-shadow: 0 0 60px var(--glow-gold);
        }

        .countdown.show {
            animation: countdownPulse 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes countdownPulse {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.5);
            }
            50% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.1);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.9);
            }
        }

        .controls {
            padding: 2rem 4rem 3rem;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .btn {
            padding: 1rem 2.5rem;
            font-size: 0.875rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 0 0.5rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.5s, height 0.5s;
        }

        .btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn-primary {
            background: var(--accent-gold);
            color: var(--bg-dark);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px var(--glow-gold);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border-subtle);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.15);
        }

        /* Professional Winner Modal - TV Broadcast Style */
        .winner-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.98);
            backdrop-filter: blur(20px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .winner-modal.show {
            display: flex;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .winner-content {
            text-align: center;
            position: relative;
            max-width: 600px;
        }

        /* Professional Winner Card */
        .winner-card-container {
            background: var(--bg-card);
            border: 2px solid var(--accent-gold);
            border-radius: 20px;
            padding: 3rem 2.5rem;
            box-shadow:
                0 0 0 1px var(--accent-gold),
                0 0 100px var(--glow-gold),
                0 30px 60px rgba(0, 0, 0, 0.5);
            animation: winnerCardEntrance 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes winnerCardEntrance {
            0% {
                opacity: 0;
                transform: scale(0.8) translateY(50px);
            }
            60% {
                transform: scale(1.05) translateY(-10px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .winner-badge {
            display: inline-block;
            padding: 0.75rem 2rem;
            background: var(--accent-gold);
            color: var(--bg-dark);
            border-radius: 50px;
            font-size: 0.875rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 2rem;
        }

        .winner-photo-large {
            width: 300px;
            height: 300px;
            margin: 0 auto 2rem;
            border-radius: 16px;
            background: linear-gradient(135deg, #2a2a2a, #1a1a1a);
            border: 3px solid var(--accent-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8rem;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 40px var(--glow-gold);
        }

        .winner-photo-large img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .winner-photo-large::before {
            content: '';
            position: absolute;
            inset: -5px;
            border-radius: 16px;
            padding: 3px;
            background: linear-gradient(45deg, var(--accent-gold), transparent, var(--accent-gold));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: rotate 4s linear infinite;
        }

        .winner-name-display {
            font-size: 3rem;
            font-weight: 800;
            color: var(--accent-gold);
            margin-bottom: 1rem;
            text-shadow: 0 0 40px var(--glow-gold);
            letter-spacing: -0.02em;
        }

        .winner-subtitle {
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-secondary);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 2.5rem;
        }

        .confetti {
            position: fixed;
            width: 8px;
            height: 8px;
            z-index: 999;
        }

        @keyframes confettiFall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .battle-circle {
                width: 700px;
                height: 500px;
            }

            .card-orbit.left {
                transform: translate3d(-300px, 0, 0);
            }

            .card-orbit.right {
                transform: translate3d(300px, 0, 0);
            }

            @keyframes ellipseLeft {
                0% {
                    transform: translate3d(-300px, 0, 0);
                    z-index: 10;
                }
                25% {
                    transform: translate3d(0, -60px, 200px);
                    z-index: 50;
                }
                50% {
                    transform: translate3d(300px, 0, 0);
                    z-index: 10;
                }
                75% {
                    transform: translate3d(0, 60px, -200px);
                    z-index: 5;
                }
                100% {
                    transform: translate3d(-300px, 0, 0);
                    z-index: 10;
                }
            }

            @keyframes ellipseRight {
                0% {
                    transform: translate3d(300px, 0, 0);
                    z-index: 10;
                }
                25% {
                    transform: translate3d(0, 60px, -200px);
                    z-index: 5;
                }
                50% {
                    transform: translate3d(-300px, 0, 0);
                    z-index: 10;
                }
                75% {
                    transform: translate3d(0, -60px, 200px);
                    z-index: 50;
                }
                100% {
                    transform: translate3d(300px, 0, 0);
                    z-index: 10;
                }
            }

            .card-orbit {
                width: 300px;
                height: 420px;
                margin-left: -150px;
                margin-top: -210px;
            }

            .card-photo {
                width: 160px;
                height: 160px;
            }

            .card-name {
                font-size: 1.5rem;
            }

            .countdown {
                font-size: 8rem;
            }

            .winner-photo-large {
                width: 240px;
                height: 240px;
                font-size: 6rem;
            }

            .winner-name-display {
                font-size: 2.5rem;
            }
        }

        @media (max-width: 768px) {
            .header {
                padding: 2rem 2rem 1rem;
            }

            .logo {
                font-size: 2rem;
            }

            .battle-circle {
                width: 500px;
                height: 400px;
            }

            .card-orbit {
                width: 260px;
                height: 360px;
                margin-left: -130px;
                margin-top: -180px;
            }

            .card-orbit.left {
                transform: translate3d(-200px, 0, 0);
            }

            .card-orbit.right {
                transform: translate3d(200px, 0, 0);
            }

            @keyframes ellipseLeft {
                0% {
                    transform: translate3d(-200px, 0, 0);
                    z-index: 10;
                }
                25% {
                    transform: translate3d(0, -40px, 150px);
                    z-index: 50;
                }
                50% {
                    transform: translate3d(200px, 0, 0);
                    z-index: 10;
                }
                75% {
                    transform: translate3d(0, 40px, -150px);
                    z-index: 5;
                }
                100% {
                    transform: translate3d(-200px, 0, 0);
                    z-index: 10;
                }
            }

            @keyframes ellipseRight {
                0% {
                    transform: translate3d(200px, 0, 0);
                    z-index: 10;
                }
                25% {
                    transform: translate3d(0, 40px, -150px);
                    z-index: 5;
                }
                50% {
                    transform: translate3d(-200px, 0, 0);
                    z-index: 10;
                }
                75% {
                    transform: translate3d(0, -40px, 150px);
                    z-index: 50;
                }
                100% {
                    transform: translate3d(200px, 0, 0);
                    z-index: 10;
                }
            }

            .card {
                padding: 1.5rem;
            }

            .card-name {
                font-size: 1.25rem;
            }

            .card-photo {
                width: 140px;
                height: 140px;
                font-size: 3rem;
            }

            .vs-divider {
                font-size: 2rem;
            }

            .countdown {
                font-size: 6rem;
            }

            .winner-card-container {
                padding: 2rem 1.5rem;
            }

            .winner-photo-large {
                width: 200px;
                height: 200px;
                font-size: 5rem;
            }

            .winner-name-display {
                font-size: 2rem;
            }

            .controls {
                padding: 1.5rem 2rem 2rem;
            }

            .btn {
                padding: 0.875rem 2rem;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="background"></div>

    <div class="container">
        <header class="header">
            <h1 class="logo">Amici</h1>
            <p class="subtitle">La Sfida</p>
        </header>

        <div class="arena">
            <div class="stage">
                <div class="battle-circle" id="battleCircle">
                    <div class="vs-divider">VS</div>

                    <!-- Card 1 -->
                    <div class="card-orbit left" id="cardOrbit1">
                        <div class="card" id="card1">
                            <div class="card-header">
                                <div class="card-badge badge-cantante">Cantante</div>
                                <h2 class="card-name">Luca Rossi</h2>
                                <p class="card-team">Squadra Zerbi-Celentano</p>
                            </div>
                            <div class="card-photo">
                                <!-- Placeholder per foto - inserire: <img src="path/to/photo.jpg" alt="Luca Rossi"> -->
                                🎤
                            </div>
                        </div>
                    </div>

                    <!-- Card 2 -->
                    <div class="card-orbit right" id="cardOrbit2">
                        <div class="card" id="card2">
                            <div class="card-header">
                                <div class="card-badge badge-ballerino">Ballerino</div>
                                <h2 class="card-name">Maria Bianchi</h2>
                                <p class="card-team">Squadra Cuccarini-Lo</p>
                            </div>
                            <div class="card-photo">
                                <!-- Placeholder per foto - inserire: <img src="path/to/photo.jpg" alt="Maria Bianchi"> -->
                                💃
                            </div>
                        </div>
                    </div>
                </div>

                <div class="countdown" id="countdown"></div>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-primary" id="startBtn" onclick="startChallenge()">
                Inizia Sfida
            </button>
            <button class="btn btn-secondary" onclick="resetChallenge()">
                Reset
            </button>
        </div>
    </div>

    <!-- Professional Winner Modal -->
    <div class="winner-modal" id="winnerModal">
        <div class="winner-content">
            <div class="winner-card-container">
                <div class="winner-badge">★ Vincitore ★</div>
                <div class="winner-photo-large" id="winnerPhotoLarge">
                    <!-- Foto vincitore apparirà qui -->
                </div>
                <h2 class="winner-name-display" id="winnerName"></h2>
                <p class="winner-subtitle" id="winnerTeam"></p>
                <button class="btn btn-primary" onclick="closeModal()" style="margin-top: 1rem;">
                    Chiudi
                </button>
            </div>
        </div>
    </div>

    <script>
        let isRunning = false;

        async function startChallenge() {
            if (isRunning) return;
            isRunning = true;

            const startBtn = document.getElementById('startBtn');
            startBtn.disabled = true;

            const battleCircle = document.getElementById('battleCircle');

            await sleep(500);

            // Start ellipse battle animation
            battleCircle.classList.add('battling');

            // Battle duration - 5 seconds for smooth ellipse
            await sleep(5000);

            battleCircle.classList.remove('battling');

            // Countdown
            await showCountdown(3);
            await showCountdown(2);
            await showCountdown(1);

            // Determine winner randomly
            const winnerNum = Math.random() > 0.5 ? 1 : 2;
            const loserNum = winnerNum === 1 ? 2 : 1;

            await revealWinner(winnerNum, loserNum);
        }

        function showCountdown(num) {
            return new Promise(resolve => {
                const countdown = document.getElementById('countdown');
                countdown.textContent = num;
                countdown.classList.add('show');

                setTimeout(() => {
                    countdown.classList.remove('show');
                    setTimeout(resolve, 100);
                }, 700);
            });
        }

        async function revealWinner(winnerNum, loserNum) {
            const winnerOrbit = document.getElementById('cardOrbit' + winnerNum);
            const loserOrbit = document.getElementById('cardOrbit' + loserNum);
            const winnerCard = document.getElementById('card' + winnerNum);

            // Animate cards
            winnerOrbit.classList.add('winner');
            loserOrbit.classList.add('loser');
            winnerCard.classList.add('winner-glow');

            await sleep(1500);

            // Get winner data
            const winnerName = winnerCard.querySelector('.card-name').textContent;
            const winnerTeam = winnerCard.querySelector('.card-team').textContent;
            const winnerPhotoContent = winnerCard.querySelector('.card-photo').innerHTML;

            // Set winner modal content
            document.getElementById('winnerName').textContent = winnerName;
            document.getElementById('winnerTeam').textContent = winnerTeam;
            document.getElementById('winnerPhotoLarge').innerHTML = winnerPhotoContent;

            // Show modal
            document.getElementById('winnerModal').classList.add('show');

            // Create confetti
            createConfetti();
        }

        function createConfetti() {
            const colors = ['#d4af37', '#dc2626', '#3b82f6', '#ffffff'];

            for (let i = 0; i < 100; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.top = '-10px';
                    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.animation = `confettiFall ${Math.random() * 2 + 2}s linear forwards`;
                    document.body.appendChild(confetti);

                    setTimeout(() => confetti.remove(), 4000);
                }, i * 30);
            }
        }

        function resetChallenge() {
            isRunning = false;

            document.getElementById('startBtn').disabled = false;
            document.getElementById('battleCircle').classList.remove('battling');

            document.querySelectorAll('.card-orbit').forEach(orbit => {
                orbit.classList.remove('winner', 'loser');
            });

            document.querySelectorAll('.card').forEach(card => {
                card.classList.remove('winner-glow');
            });

            document.getElementById('winnerModal').classList.remove('show');
            document.querySelectorAll('.confetti').forEach(c => c.remove());
        }

        function closeModal() {
            document.getElementById('winnerModal').classList.remove('show');
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        document.getElementById('winnerModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });
    </script>
</body>
</html>
