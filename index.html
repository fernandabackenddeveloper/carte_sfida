<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amici - Sfida</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;800;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #000000;
            --bg-card: #0f0f0f;
            --border-subtle: rgba(255, 255, 255, 0.06);
            --text-primary: #ffffff;
            --text-secondary: #888888;
            --accent-gold: #c9a961;
            --accent-red: #e74c3c;
            --accent-blue: #3498db;
            --glow-gold: rgba(201, 169, 97, 0.4);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            overflow: hidden;
            position: relative;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 30% 40%, rgba(201, 169, 97, 0.02) 0%, transparent 50%),
                radial-gradient(circle at 70% 60%, rgba(52, 152, 219, 0.02) 0%, transparent 50%),
                var(--bg-dark);
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 4rem 4rem 3rem;
            text-align: center;
        }

        .logo {
            font-size: 3rem;
            font-weight: 200;
            letter-spacing: 0.3em;
            color: var(--text-primary);
            margin-bottom: 0.75rem;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 0.75rem;
            font-weight: 400;
            letter-spacing: 0.2em;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .arena {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 2rem;
        }

        .stage {
            position: relative;
            width: 100%;
            max-width: 1400px;
            height: 700px;
            perspective: 2000px;
        }

        .battle-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 1000px;
            height: 700px;
            transform: translate(-50%, -50%);
            transform-style: preserve-3d;
        }

        .card-orbit {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 380px;
            height: 520px;
            margin-left: -190px;
            margin-top: -260px;
            transform-style: preserve-3d;
            will-change: transform;
        }

        .card-orbit.left {
            transform: translate3d(-450px, 0, 0);
        }

        .card-orbit.right {
            transform: translate3d(450px, 0, 0);
        }

        /* Smooth 15-second ellipse animation with many keyframes for fluid motion */
        .battle-circle.battling .card-orbit.left {
            animation: ellipseLeftSmooth 15s linear infinite;
        }

        .battle-circle.battling .card-orbit.right {
            animation: ellipseRightSmooth 15s linear infinite;
        }

        /* Ultra-smooth left card ellipse - 20 keyframes for perfect fluidity */
        @keyframes ellipseLeftSmooth {
            0% { transform: translate3d(-450px, 0px, 0px); z-index: 10; }
            5% { transform: translate3d(-360px, -35px, 80px); z-index: 15; }
            10% { transform: translate3d(-260px, -65px, 150px); z-index: 25; }
            15% { transform: translate3d(-150px, -85px, 200px); z-index: 35; }
            20% { transform: translate3d(-40px, -95px, 230px); z-index: 45; }
            25% { transform: translate3d(70px, -100px, 250px); z-index: 50; }
            30% { transform: translate3d(180px, -95px, 230px); z-index: 45; }
            35% { transform: translate3d(280px, -85px, 200px); z-index: 35; }
            40% { transform: translate3d(370px, -65px, 150px); z-index: 25; }
            45% { transform: translate3d(430px, -35px, 80px); z-index: 15; }
            50% { transform: translate3d(450px, 0px, 0px); z-index: 10; }
            55% { transform: translate3d(430px, 35px, -80px); z-index: 5; }
            60% { transform: translate3d(370px, 65px, -150px); z-index: 3; }
            65% { transform: translate3d(280px, 85px, -200px); z-index: 2; }
            70% { transform: translate3d(180px, 95px, -230px); z-index: 1; }
            75% { transform: translate3d(70px, 100px, -250px); z-index: 1; }
            80% { transform: translate3d(-40px, 95px, -230px); z-index: 2; }
            85% { transform: translate3d(-150px, 85px, -200px); z-index: 3; }
            90% { transform: translate3d(-260px, 65px, -150px); z-index: 5; }
            95% { transform: translate3d(-360px, 35px, -80px); z-index: 8; }
            100% { transform: translate3d(-450px, 0px, 0px); z-index: 10; }
        }

        /* Ultra-smooth right card ellipse - opposite phase */
        @keyframes ellipseRightSmooth {
            0% { transform: translate3d(450px, 0px, 0px); z-index: 10; }
            5% { transform: translate3d(430px, 35px, -80px); z-index: 5; }
            10% { transform: translate3d(370px, 65px, -150px); z-index: 3; }
            15% { transform: translate3d(280px, 85px, -200px); z-index: 2; }
            20% { transform: translate3d(180px, 95px, -230px); z-index: 1; }
            25% { transform: translate3d(70px, 100px, -250px); z-index: 1; }
            30% { transform: translate3d(-40px, 95px, -230px); z-index: 2; }
            35% { transform: translate3d(-150px, 85px, -200px); z-index: 3; }
            40% { transform: translate3d(-260px, 65px, -150px); z-index: 5; }
            45% { transform: translate3d(-360px, 35px, -80px); z-index: 8; }
            50% { transform: translate3d(-450px, 0px, 0px); z-index: 10; }
            55% { transform: translate3d(-360px, -35px, 80px); z-index: 15; }
            60% { transform: translate3d(-260px, -65px, 150px); z-index: 25; }
            65% { transform: translate3d(-150px, -85px, 200px); z-index: 35; }
            70% { transform: translate3d(-40px, -95px, 230px); z-index: 45; }
            75% { transform: translate3d(70px, -100px, 250px); z-index: 50; }
            80% { transform: translate3d(180px, -95px, 230px); z-index: 45; }
            85% { transform: translate3d(280px, -85px, 200px); z-index: 35; }
            90% { transform: translate3d(370px, -65px, 150px); z-index: 25; }
            95% { transform: translate3d(430px, -35px, 80px); z-index: 15; }
            100% { transform: translate3d(450px, 0px, 0px); z-index: 10; }
        }

        /* Winner animation */
        .card-orbit.winner {
            animation: winnerReveal 2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards !important;
            z-index: 100 !important;
        }

        .card-orbit.loser {
            animation: loserFadeOut 2s cubic-bezier(0.4, 0, 0.2, 1) forwards !important;
            z-index: 1 !important;
        }

        @keyframes winnerReveal {
            to {
                transform: translate(-50%, -50%) scale(1.1);
                left: 50%;
                top: 50%;
                margin: 0;
            }
        }

        @keyframes loserFadeOut {
            to {
                opacity: 0;
                transform: translate3d(0, 0, -600px) scale(0.6);
            }
        }

        /* Exceptional Card Design */
        .card {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--bg-card) 0%, rgba(20, 20, 20, 0.95) 100%);
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
            padding: 3rem 2.5rem;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(40px);
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.05), transparent);
        }

        .card.winner-glow {
            border-color: var(--accent-gold);
            background: linear-gradient(135deg, rgba(201, 169, 97, 0.08) 0%, var(--bg-card) 100%);
            box-shadow:
                0 0 1px 1px var(--accent-gold),
                0 0 80px var(--glow-gold),
                0 30px 60px rgba(0, 0, 0, 0.6);
        }

        .card-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .card-badge {
            display: inline-block;
            padding: 0.5rem 1.5rem;
            border-radius: 4px;
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 1.25rem;
        }

        .badge-cantante {
            background: var(--accent-red);
            color: white;
        }

        .badge-ballerino {
            background: var(--accent-blue);
            color: white;
        }

        .card-name {
            font-size: 2rem;
            font-weight: 300;
            color: var(--text-primary);
            margin-bottom: 0.75rem;
            letter-spacing: -0.01em;
        }

        .card-team {
            font-size: 0.8rem;
            font-weight: 400;
            color: var(--text-secondary);
            margin-bottom: 2rem;
            letter-spacing: 0.05em;
        }

        .card-photo {
            width: 240px;
            height: 240px;
            margin: 0 auto 1.5rem;
            border-radius: 16px;
            background: linear-gradient(135deg, #1a1a1a, #0a0a0a);
            border: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5rem;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .card-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card.winner-glow .card-photo {
            border-color: var(--accent-gold);
            box-shadow: 0 0 50px var(--glow-gold);
        }

        .card.winner-glow .card-photo::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 16px;
            padding: 1px;
            background: linear-gradient(45deg, var(--accent-gold), transparent, var(--accent-gold));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: rotate 4s linear infinite;
        }

        @keyframes rotate {
            to { transform: rotate(360deg); }
        }

        .vs-divider {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 4rem;
            font-weight: 200;
            color: rgba(255, 255, 255, 0.15);
            letter-spacing: 0.2em;
            z-index: 5;
            pointer-events: none;
        }

        .countdown {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 14rem;
            font-weight: 200;
            color: var(--accent-gold);
            opacity: 0;
            pointer-events: none;
            z-index: 200;
            text-shadow: 0 0 80px var(--glow-gold);
        }

        .countdown.show {
            animation: countdownPulse 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes countdownPulse {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.5);
            }
            50% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.9);
            }
        }

        .controls {
            padding: 2rem 4rem 4rem;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .btn {
            padding: 1.25rem 3rem;
            font-size: 0.75rem;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin: 0 0.75rem;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn:hover::before {
            width: 400px;
            height: 400px;
        }

        .btn-primary {
            background: var(--accent-gold);
            color: var(--bg-dark);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px var(--glow-gold);
        }

        .btn-primary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border-subtle);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.03);
            border-color: rgba(255, 255, 255, 0.12);
            color: var(--text-primary);
        }

        /* Exceptional Winner Modal */
        .winner-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.98);
            backdrop-filter: blur(30px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .winner-modal.show {
            display: flex;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .winner-content {
            text-align: center;
            position: relative;
            max-width: 700px;
        }

        .winner-card-container {
            background: linear-gradient(135deg, rgba(201, 169, 97, 0.05) 0%, var(--bg-card) 100%);
            border: 1px solid var(--accent-gold);
            border-radius: 24px;
            padding: 4rem 3.5rem;
            box-shadow:
                0 0 1px 1px var(--accent-gold),
                0 0 120px var(--glow-gold),
                0 40px 80px rgba(0, 0, 0, 0.6);
            animation: winnerCardEntrance 1s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes winnerCardEntrance {
            0% {
                opacity: 0;
                transform: scale(0.7) translateY(100px);
            }
            60% {
                transform: scale(1.03) translateY(-15px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .winner-badge {
            display: inline-block;
            padding: 0.875rem 2.5rem;
            background: var(--accent-gold);
            color: var(--bg-dark);
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-bottom: 3rem;
        }

        .winner-photo-large {
            width: 340px;
            height: 340px;
            margin: 0 auto 2.5rem;
            border-radius: 20px;
            background: linear-gradient(135deg, #1a1a1a, #0a0a0a);
            border: 2px solid var(--accent-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10rem;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 60px var(--glow-gold);
        }

        .winner-photo-large img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .winner-photo-large::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 20px;
            padding: 2px;
            background: linear-gradient(45deg, var(--accent-gold), transparent, var(--accent-gold));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: rotate 5s linear infinite;
        }

        .winner-name-display {
            font-size: 3.5rem;
            font-weight: 300;
            color: var(--accent-gold);
            margin-bottom: 1.25rem;
            text-shadow: 0 0 60px var(--glow-gold);
            letter-spacing: -0.01em;
        }

        .winner-subtitle {
            font-size: 0.9rem;
            font-weight: 400;
            color: var(--text-secondary);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 3rem;
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            z-index: 999;
        }

        @keyframes confettiFall {
            to {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .battle-circle {
                width: 800px;
                height: 600px;
            }

            .card-orbit {
                width: 340px;
                height: 460px;
                margin-left: -170px;
                margin-top: -230px;
            }

            .card-orbit.left {
                transform: translate3d(-350px, 0, 0);
            }

            .card-orbit.right {
                transform: translate3d(350px, 0, 0);
            }

            .card-photo {
                width: 200px;
                height: 200px;
                font-size: 4rem;
            }

            .card-name {
                font-size: 1.75rem;
            }

            .countdown {
                font-size: 10rem;
            }

            .winner-photo-large {
                width: 280px;
                height: 280px;
                font-size: 8rem;
            }

            .winner-name-display {
                font-size: 2.75rem;
            }
        }

        @media (max-width: 768px) {
            .header {
                padding: 3rem 2rem 2rem;
            }

            .logo {
                font-size: 2.25rem;
            }

            .battle-circle {
                width: 600px;
                height: 500px;
            }

            .card-orbit {
                width: 280px;
                height: 380px;
                margin-left: -140px;
                margin-top: -190px;
            }

            .card-orbit.left {
                transform: translate3d(-250px, 0, 0);
            }

            .card-orbit.right {
                transform: translate3d(250px, 0, 0);
            }

            .card {
                padding: 2rem 1.5rem;
            }

            .card-name {
                font-size: 1.5rem;
            }

            .card-photo {
                width: 160px;
                height: 160px;
                font-size: 3.5rem;
            }

            .vs-divider {
                font-size: 2.5rem;
            }

            .countdown {
                font-size: 7rem;
            }

            .winner-card-container {
                padding: 3rem 2rem;
            }

            .winner-photo-large {
                width: 220px;
                height: 220px;
                font-size: 6rem;
            }

            .winner-name-display {
                font-size: 2rem;
            }

            .controls {
                padding: 1.5rem 2rem 3rem;
            }

            .btn {
                padding: 1rem 2rem;
                font-size: 0.7rem;
            }
        }
    </style>
</head>
<body>
    <div class="background"></div>

    <div class="container">
        <header class="header">
            <h1 class="logo">AMICI</h1>
            <p class="subtitle">La Sfida</p>
        </header>

        <div class="arena">
            <div class="stage">
                <div class="battle-circle" id="battleCircle">
                    <div class="vs-divider">VS</div>

                    <div class="card-orbit left" id="cardOrbit1">
                        <div class="card" id="card1">
                            <div class="card-header">
                                <div class="card-badge badge-cantante">Cantante</div>
                                <h2 class="card-name">Luca Rossi</h2>
                                <p class="card-team">Squadra Zerbi-Celentano</p>
                            </div>
                            <div class="card-photo">
                                <!-- Inserire: <img src="path/to/photo.jpg" alt="Luca Rossi"> -->
                                🎤
                            </div>
                        </div>
                    </div>

                    <div class="card-orbit right" id="cardOrbit2">
                        <div class="card" id="card2">
                            <div class="card-header">
                                <div class="card-badge badge-ballerino">Ballerino</div>
                                <h2 class="card-name">Maria Bianchi</h2>
                                <p class="card-team">Squadra Cuccarini-Lo</p>
                            </div>
                            <div class="card-photo">
                                <!-- Inserire: <img src="path/to/photo.jpg" alt="Maria Bianchi"> -->
                                💃
                            </div>
                        </div>
                    </div>
                </div>

                <div class="countdown" id="countdown"></div>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-primary" id="startBtn" onclick="startChallenge()">
                Inizia Sfida
            </button>
            <button class="btn btn-secondary" onclick="resetChallenge()">
                Reset
            </button>
        </div>
    </div>

    <div class="winner-modal" id="winnerModal">
        <div class="winner-content">
            <div class="winner-card-container">
                <div class="winner-badge">★ Vincitore ★</div>
                <div class="winner-photo-large" id="winnerPhotoLarge"></div>
                <h2 class="winner-name-display" id="winnerName"></h2>
                <p class="winner-subtitle" id="winnerTeam"></p>
                <button class="btn btn-primary" onclick="closeModal()">
                    Chiudi
                </button>
            </div>
        </div>
    </div>

    <script>
        let isRunning = false;

        async function startChallenge() {
            if (isRunning) return;
            isRunning = true;

            const startBtn = document.getElementById('startBtn');
            startBtn.disabled = true;

            const battleCircle = document.getElementById('battleCircle');

            await sleep(800);

            // Start smooth 15-second ellipse animation
            battleCircle.classList.add('battling');

            // Battle duration - 15 seconds
            await sleep(15000);

            battleCircle.classList.remove('battling');

            // Countdown
            await showCountdown(3);
            await showCountdown(2);
            await showCountdown(1);

            // Determine winner
            const winnerNum = Math.random() > 0.5 ? 1 : 2;
            const loserNum = winnerNum === 1 ? 2 : 1;

            await revealWinner(winnerNum, loserNum);
        }

        function showCountdown(num) {
            return new Promise(resolve => {
                const countdown = document.getElementById('countdown');
                countdown.textContent = num;
                countdown.classList.add('show');

                setTimeout(() => {
                    countdown.classList.remove('show');
                    setTimeout(resolve, 150);
                }, 850);
            });
        }

        async function revealWinner(winnerNum, loserNum) {
            const winnerOrbit = document.getElementById('cardOrbit' + winnerNum);
            const loserOrbit = document.getElementById('cardOrbit' + loserNum);
            const winnerCard = document.getElementById('card' + winnerNum);

            winnerOrbit.classList.add('winner');
            loserOrbit.classList.add('loser');
            winnerCard.classList.add('winner-glow');

            await sleep(2000);

            const winnerName = winnerCard.querySelector('.card-name').textContent;
            const winnerTeam = winnerCard.querySelector('.card-team').textContent;
            const winnerPhotoContent = winnerCard.querySelector('.card-photo').innerHTML;

            document.getElementById('winnerName').textContent = winnerName;
            document.getElementById('winnerTeam').textContent = winnerTeam;
            document.getElementById('winnerPhotoLarge').innerHTML = winnerPhotoContent;

            document.getElementById('winnerModal').classList.add('show');

            createConfetti();
        }

        function createConfetti() {
            const colors = ['#c9a961', '#e74c3c', '#3498db', '#ffffff', '#f39c12'];

            for (let i = 0; i < 120; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.top = '-20px';
                    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.width = (Math.random() * 6 + 4) + 'px';
                    confetti.style.height = (Math.random() * 6 + 4) + 'px';
                    confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                    confetti.style.animation = `confettiFall ${Math.random() * 2.5 + 2.5}s linear forwards`;
                    document.body.appendChild(confetti);

                    setTimeout(() => confetti.remove(), 5000);
                }, i * 25);
            }
        }

        function resetChallenge() {
            isRunning = false;

            document.getElementById('startBtn').disabled = false;
            document.getElementById('battleCircle').classList.remove('battling');

            document.querySelectorAll('.card-orbit').forEach(orbit => {
                orbit.classList.remove('winner', 'loser');
            });

            document.querySelectorAll('.card').forEach(card => {
                card.classList.remove('winner-glow');
            });

            document.getElementById('winnerModal').classList.remove('show');
            document.querySelectorAll('.confetti').forEach(c => c.remove());
        }

        function closeModal() {
            document.getElementById('winnerModal').classList.remove('show');
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        document.getElementById('winnerModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });
    </script>
</body>
</html>
